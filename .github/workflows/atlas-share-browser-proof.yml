name: Atlas share and observer browser proof
'on':
  push:
    branches: [codex/atlas-share-browser-proof-20261119]
    paths:
      - '.github/workflows/atlas-share-browser-proof.yml'
      - 'tools/atlas-share-proof/**'
permissions:
  contents: read
jobs:
  portable-recipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out proof branch and pinned release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact payload and compare negative and fixed browser cases
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/tools/atlas-share-proof"
          printf '%s  %s\n' 01acdc34b32336a728ed234a24b1be033e27f5f4b605fd124e32f8009b3ff1ba SHA256SUMS | sha256sum --check
          sha256sum --check SHA256SUMS
          bash run-browser.sh "$GITHUB_WORKSPACE"
